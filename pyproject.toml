[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geoconvert-cli"
version = "0.1.0"
description = "Convert common geospatial files with one command. Probe inputs, batch convert, and reproject to WGS84 for KML."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    { name = "Steve Witmer" }
]
keywords = [
    "geospatial",
    "gis",
    "shapefile",
    "geojson",
    "kml",
    "gpx",
    "converter",
    "projection",
    "wgs84",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "pyshp>=2.3.0",
    "pyproj>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]

[project.scripts]
geoconvert = "geoconvert.cli:main"

[project.urls]
Homepage = "https://github.com/stevewitmer/geoconvert-cli"
Repository = "https://github.com/stevewitmer/geoconvert-cli"
Issues = "https://github.com/stevewitmer/geoconvert-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/geoconvert"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
